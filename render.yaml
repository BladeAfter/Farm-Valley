services:
  - type: web
    name: farm-valley
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_REQUIRED
        value: "true"
      - key: DATABASE_CA_PATH
        value: server/database/certs/supabase-ca-2021.crt
      - key: DATABASE_URL
        sync: false
